name: Test Framer Date Sync

on:
  workflow_dispatch:
    inputs:
      source_filename:
        description: Exact Source Filename value in Framer CMS
        required: true
        type: string

      paper_path:
        description: Exact repository path to that file
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-one-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Update one Framer CMS date
        run: npm run sync-one-date
        env:
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
          FRAMER_COLLECTION_ID: ${{ vars.FRAMER_COLLECTION_ID }}
          FRAMER_SOURCE_FILENAME_FIELD_ID: ${{ vars.FRAMER_SOURCE_FILENAME_FIELD_ID }}
          FRAMER_LAST_UPDATED_FIELD_ID: ${{ vars.FRAMER_LAST_UPDATED_FIELD_ID }}
          SOURCE_FILENAME: ${{ inputs.source_filename }}
          PAPER_PATH: ${{ inputs.paper_path }}
